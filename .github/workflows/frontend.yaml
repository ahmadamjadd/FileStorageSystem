name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Deploy React Frontend to S3
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      env:
        # Pass the production backend URL to React during build
        VITE_API_URL: http://13.201.76.243:8000
      run: |
        cd frontend
        npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::053108159236:role/github-actions-deploy-role
        aws-region: ap-south-1

    - name: Deploy to S3
      run: |
        # Sync the dist folder to S3. 
        # --delete removes any old files in S3 that don't exist in the new build.
        aws s3 sync ./frontend/dist s3://cloud-filestorage-9080  --delete
